syntax = "proto3";

option java_package = "expo.modules.protobuffer";
option java_multiple_files = true;

message Data {
    string sensor = 1;
    string config = 2;
    int32 freq = 3;
    repeated DataPoint data = 4;
  }
  
  message DataPoint {
    string value = 1;
    int64 timestamp = 2;
  }

